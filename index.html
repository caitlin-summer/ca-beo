<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cá Béo – Học Tiếng Anh Dưới Đại Dương</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#7cc6f0;touch-action:none;font-family:'Quicksand',system-ui,sans-serif;overscroll-behavior:none;user-select:none;color:#35507a}
canvas{display:block;position:fixed;inset:0}
.hidden{display:none!important}
.card{background:rgba(255,255,255,.9);border:2px solid #fff;border-radius:18px;backdrop-filter:blur(8px);box-shadow:0 4px 18px rgba(20,60,120,.12)}
#hud{position:fixed;top:86px;left:12px;display:flex;gap:12px;align-items:center;padding:8px 14px;z-index:20;pointer-events:none}
#hud small{font-size:10px;font-weight:700;color:#8a9bb5;display:block}
#hud b{font-size:22px;line-height:1;color:#e0568a}
#combo-b{color:#f08a24!important}
#right{position:fixed;top:86px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:20;pointer-events:none}
#timer{padding:6px 14px;font-weight:700;color:#f08a24}
.badge{padding:3px 10px;border-radius:10px;font-size:12px;font-weight:700;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.1)}
#target{position:fixed;top:10px;left:50%;transform:translateX(-50%);padding:6px 22px;text-align:center;z-index:20;pointer-events:none;white-space:nowrap}
#target small{font-size:11px;font-weight:700;color:#8a9bb5;display:block}
#target div{font-size:24px;font-weight:700;color:#1f4e9c}
#toast{position:fixed;bottom:14px;left:50%;transform:translate(-50%,8px);padding:6px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap;background:#fff}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{color:#1b8a5a;border:2px solid #8fdcb6}#toast.bad{color:#c2415b;border:2px solid #f4a9b8}#toast.meh{color:#3b7bb8;border:2px solid #b5d8f2}
#ui{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:30;pointer-events:none}
.modal{pointer-events:auto;background:rgba(255,255,255,.96);border-radius:32px;border:6px solid #eaf5ff;box-shadow:0 20px 50px rgba(20,60,120,.18);width:92%;max-width:400px;padding:22px;text-align:center;max-height:94vh;overflow:auto}
h1{margin:0 0 2px;font-size:38px;color:#2f8fc7}h2{margin:0 0 10px;color:#e0568a}
.sub{margin:0 0 16px;font-size:13px;font-weight:700;color:#8a9bb5}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:13px;margin-top:10px;font:700 17px 'Quicksand',sans-serif;cursor:pointer;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.pink{background:#ffc8dd;color:#c43d73;box-shadow:0 4px 0 #ffafcc}.blue{background:#8fd0f5;color:#fff;box-shadow:0 4px 0 #62b6e6}
.ghost{background:none;color:#4a9fd6;font-size:14px;padding:8px}
.tabs{display:flex;justify-content:center;gap:4px;margin-bottom:10px}
.tab{padding:6px 12px;border-radius:12px;font-size:11px;font-weight:700;color:#888;background:#f0f4f8;cursor:pointer}
.tab.on{background:#ffc8dd;color:#c43d73}
.list{max-height:200px;overflow:auto;margin-bottom:12px}
.row{background:#fff;border:1px solid #eef2f7;padding:9px 12px;border-radius:12px;display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:6px 0 12px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:#e3f6ec;color:#1b8a5a}
.chip.miss{background:#fde8ee;color:#c2415b}
.pill{display:inline-block;padding:4px 12px;border-radius:12px;background:#eaf5ff;font-size:12px;font-weight:700;color:#2f8fc7;margin-bottom:6px}
input{flex:1;min-width:0;padding:9px;border-radius:12px;border:2px solid #fff;text-align:center;font:700 13px 'Quicksand',sans-serif}
</style></head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="card hidden">
  <div><small>ĐIỂM</small><b id="score">0</b></div>
  <div id="combo" class="hidden"><small>COMBO</small><b id="combo-b">x1</b></div>
  <div id="lives"></div>
</div>
<div id="right"><div id="timer" class="card hidden">⏳ <span id="tsec">30</span>s</div><div id="fx"></div></div>
<div id="target" class="card hidden"><small>Ăn con cá mang từ tiếng Anh của</small><div><span id="t-e"></span> <span id="t-vi"></span></div></div>
<div id="toast"></div>

<div id="ui">
  <div id="start" class="modal">
    <h1>CÁ BÉO 🫧</h1>
    <p class="sub">Bơi, ăn cá, học từ vựng tiếng Anh!</p>
    <div class="pill">📚 Đã thuộc <span id="prog">0</span>/<span id="total">0</span> từ</div>
    <div class="tabs" id="lv-tabs"><div class="tab on" data-k="easy">Dễ</div><div class="tab" data-k="medium">Trung bình</div><div class="tab" data-k="hard">Khó</div></div>
    <button class="btn pink" onclick="startGame('lives')">SINH TỒN ❤️</button>
    <div style="display:flex;gap:8px"><button class="btn blue" onclick="startGame('timed',30)">30s ⏱️</button><button class="btn blue" onclick="startGame('timed',45)">45s ⏱️</button><button class="btn blue" onclick="startGame('timed',60)">60s ⏱️</button></div>
    <button class="btn ghost" onclick="showLB()">🏆 Bảng xếp hạng</button>
    <button class="btn ghost" id="spk" onclick="toggleSpeak()" style="margin-top:0">🔊 Phát âm: Bật</button>
  </div>
  <div id="lb" class="modal hidden">
    <h2>BẢNG VÀNG</h2>
    <div class="tabs" id="lb-tabs"></div>
    <div id="lb-list" class="list"></div>
    <button class="btn" style="background:#f1f4f8;color:#778" onclick="hideLB()">QUAY LẠI</button>
  </div>
  <div id="over" class="modal hidden">
    <h2>KẾT THÚC!</h2>
    <p style="margin:0 0 10px;color:#8a9bb5">Bạn đạt <b id="final" style="font-size:28px;color:#e0568a">0</b> điểm</p>
    <div id="recap"></div>
    <div style="display:flex;gap:8px;background:#fff0f5;padding:10px;border-radius:20px;margin-bottom:10px">
      <input id="name" placeholder="Tên..." maxlength="12"><button class="btn pink" id="save" style="width:auto;margin:0;padding:8px 18px;font-size:14px">LƯU</button>
    </div>
    <div class="tabs" id="end-tabs"></div>
    <div id="end-list" class="list" style="max-height:100px"></div>
    <button class="btn pink" onclick="toMenu()">CHƠI TIẾP</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
// ---------- Vocabulary ----------
const WORDS=('🐱|cat|con mèo,🐶|dog|con chó,🍎|apple|quả táo,🍌|banana|quả chuối,📘|book|quyển sách,🏠|house|ngôi nhà,🚗|car|xe hơi,🌳|tree|cái cây,☀️|sun|mặt trời,🌙|moon|mặt trăng,⭐|star|ngôi sao,💧|water|nước,🔥|fire|lửa,🌸|flower|bông hoa,🐦|bird|con chim,🍚|rice|cơm,🥛|milk|sữa,🍞|bread|bánh mì,🎂|cake|bánh kem,✏️|pencil|bút chì,🎒|bag|cái cặp,🪑|chair|cái ghế,🛏️|bed|cái giường,📱|phone|điện thoại,⚽|ball|quả bóng,🚲|bike|xe đạp,✈️|plane|máy bay,🚌|bus|xe buýt,👁️|eye|con mắt,✋|hand|bàn tay,😊|happy|vui vẻ,😢|sad|buồn,🐘|elephant|con voi,🌧️|rain|mưa,🍉|watermelon|dưa hấu,🐴|horse|con ngựa,🐟|fish|con cá,🐷|pig|con heo,🐮|cow|con bò,🐔|chicken|con gà,🦆|duck|con vịt,🐰|rabbit|con thỏ,🐵|monkey|con khỉ,🐯|tiger|con hổ,🦁|lion|sư tử,🐻|bear|con gấu,🐸|frog|con ếch,🐢|turtle|con rùa,🦋|butterfly|con bướm,🐝|bee|con ong,🐍|snake|con rắn,🐑|sheep|con cừu,🐼|panda|gấu trúc,🦒|giraffe|hươu cao cổ,🐙|octopus|con bạch tuộc,🍊|orange|quả cam,🍇|grapes|nho,🍓|strawberry|dâu tây,🥕|carrot|cà rốt,🥚|egg|quả trứng,🍕|pizza|bánh pizza,🍔|burger|bánh hamburger,🔑|key|chìa khóa,⏰|clock|đồng hồ,🚪|door|cửa ra vào,👕|shirt|áo sơ mi,👟|shoe|giày,🎩|hat|cái mũ,☂️|umbrella|cái ô,🎁|gift|món quà,💡|lamp|bóng đèn,✂️|scissors|cái kéo,🎈|balloon|bóng bay,🚀|rocket|tên lửa,🚢|ship|con tàu,🚂|train|tàu hỏa,🌈|rainbow|cầu vồng,❄️|snow|tuyết,⛰️|mountain|ngọn núi,🌊|wave|sóng biển,👂|ear|cái tai,👃|nose|cái mũi,👄|mouth|cái miệng,🦷|tooth|cái răng,❤️|heart|trái tim,😴|sleepy|buồn ngủ,😡|angry|tức giận,🎵|music|âm nhạc').split(',').map(s=>{const[e,en,vi]=s.split('|');return{e,en,vi}});
let vocab={};try{vocab=JSON.parse(localStorage.getItem('fish_vocab')||'{}')}catch(_){}
let speakOn=true;
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));for(const re of[/Google US English/i,/Samantha/i,/Aria|Jenny/i,/Natural/i,/Zira|Karen|Moira|Tessa/i,/female/i]){const f=v.find(x=>re.test(x.name));if(f){voice=f;return}}voice=v.find(x=>x.lang==='en-US')||v[0]||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){if(!speakOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.88;u.pitch=1.12;speechSynthesis.speak(u)}
function toggleSpeak(){speakOn=!speakOn;$('spk').textContent='🔊 Phát âm: '+(speakOn?'Bật':'Tắt')}
function progress(){$('prog').textContent=WORDS.filter(w=>vocab[w.en]).length;$('total').textContent=WORDS.length}

// ---------- Sound ----------
let A;try{A=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
function tone(type,f0,f1,d,v,delay=0){if(!A)return;const t=A.currentTime+delay,o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(A.destination);o.start(t);o.stop(t+d)}
const SFX={eat:()=>tone('sine',600,150,.1,.25),hit:()=>tone('square',150,40,.2,.15),ok:()=>{tone('triangle',523,523,.12,.25);tone('triangle',784,784,.18,.25,.1)},bad:()=>tone('sawtooth',220,110,.25,.12),boss:()=>{for(let i=0;i<3;i++)tone('sawtooth',200,800,.12,.1,i*.2)},magnet:()=>{tone('sine',300,900,.25,.2);tone('sine',500,1200,.3,.15,.12)},crunch:()=>tone('sawtooth',200,60,.12,.14),growl:()=>{tone('sawtooth',110,35,.7,.22);tone('square',70,30,.8,.1)}};

// ---------- Leaderboard ----------
const LB='fish_game_offline_lb';
function lbGet(f){const d=JSON.parse(localStorage.getItem(LB)||'[]'),n=Date.now(),D=864e5,lim={day:D,week:D*7,month:D*30}[f];return d.filter(x=>!lim||n-x.t<lim).sort((a,b)=>b.score-a.score).slice(0,10)}
function lbSave(name,score){const d=JSON.parse(localStorage.getItem(LB)||'[]');d.push({name:name||'Cá Ẩn Danh',score,t:Date.now(),l:lvKey});localStorage.setItem(LB,JSON.stringify(d))}
function lbRender(listId,f){const d=lbGet(f);$(listId).innerHTML=d.length?d.map((x,i)=>`<div class="row"><b>#${i+1} ${x.name.replace(/</g,'&lt;')}${x.l&&LV[x.l]?` <small style="color:#9ab">${LV[x.l].n}</small>`:''}</b><b style="color:#2f8fc7">${x.score}</b></div>`).join(''):'<p style="color:#aab;font-size:12px;padding:20px 0">Trống</p>'}
function lbTabs(tabsId,listId,opts){const el=$(tabsId);el.innerHTML=opts.map(([k,l],i)=>`<div class="tab ${i?'':'on'}" data-k="${k}">${l}</div>`).join('');el.onclick=e=>{const k=e.target.dataset.k;if(!k)return;el.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===e.target));lbRender(listId,k)}}
lbTabs('lb-tabs','lb-list',[['all','Tổng'],['day','Ngày'],['week','Tuần'],['month','Tháng']]);
lbTabs('end-tabs','end-list',[['all','Top'],['day','Ngày']]);
function showLB(){$('start').classList.add('hidden');$('lb').classList.remove('hidden');lbRender('lb-list','all')}
function hideLB(){$('lb').classList.add('hidden');$('start').classList.remove('hidden')}

// ---------- Colors & sprites ----------
const PAL=['#ff9aa2','#ffc08a','#ffe27a','#a8e6a1','#7fe0e8','#8fb4ff','#b9a6ff','#ff9be4'],BOSS='#455a64',GOLD='#FFD700',SP={};
function sh(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=a<0?0:255,t=Math.abs(a);return`rgb(${Math.round((f-r)*t+r)},${Math.round((f-g)*t+g)},${Math.round((f-b)*t+b)})`}
function eye(c,x,y,r){c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='#2b2d42';c.beginPath();c.arc(x+r*.2,y,r*.55,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+r*.35,y-r*.25,r*.2,0,7);c.fill()}
function lg(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g}
const DRAW={
fish(c,r,col){const L=sh(col,.4),D=sh(col,-.25);
 c.fillStyle=D;c.beginPath();c.moveTo(-r*.7,0);c.quadraticCurveTo(-r*1.4,-r*.95,-r*1.65,-r*.7);c.quadraticCurveTo(-r*1.3,0,-r*1.65,r*.7);c.quadraticCurveTo(-r*1.4,r*.95,-r*.7,0);c.fill();
 c.beginPath();c.moveTo(-r*.5,-r*.6);c.quadraticCurveTo(-r*.05,-r*1.35,r*.5,-r*.55);c.closePath();c.fill();
 c.fillStyle=lg(c,-r*.8,r*.8,[L,col,D]);c.beginPath();c.ellipse(0,0,r,r*.75,0,0,7);c.fill();
 c.save();c.beginPath();c.ellipse(0,0,r,r*.75,0,0,7);c.clip();
 c.fillStyle='rgba(255,255,255,.22)';for(let i=0;i<3;i++)c.fillRect(-r*.55+i*r*.38,-r,r*.14,r*2);
 c.fillStyle='rgba(255,255,255,.4)';c.beginPath();c.ellipse(0,r*.5,r*.85,r*.25,0,0,7);c.fill();c.restore();
 c.fillStyle=D;c.beginPath();c.ellipse(-r*.1,r*.2,r*.32,r*.15,.6,0,7);c.fill();
 c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(r*.05,-r*.5,r*.4,r*.1,-.15,0,7);c.fill();
 c.strokeStyle=sh(col,-.4);c.lineWidth=2;c.beginPath();c.arc(r*.9,r*.12,r*.18,.2,1.3);c.stroke();
 eye(c,r*.55,-r*.15,r*.2)},
squid(c,r,col){const L=sh(col,.4),D=sh(col,-.25);
 c.strokeStyle=D;c.lineCap='round';c.lineWidth=r*.13;
 for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(-r*.5,i*r*.17);c.bezierCurveTo(-r*.9,i*r*.3-r*.25,-r*1.1,i*r*.3+r*.25,-r*1.6,i*r*.38);c.stroke()}
 c.fillStyle=lg(c,-r*.7,r*.7,[L,col,D]);c.beginPath();c.moveTo(r*1.05,0);c.quadraticCurveTo(r*.3,-r*.8,-r*.7,-r*.35);c.lineTo(-r*.7,r*.35);c.quadraticCurveTo(r*.3,r*.8,r*1.05,0);c.fill();
 c.fillStyle='rgba(255,255,255,.35)';for(const[x,y]of[[-.1,-.3],[.2,.28],[-.35,.1]]){c.beginPath();c.arc(r*x,r*y,r*.07,0,7);c.fill()}
 eye(c,r*.5,-r*.12,r*.2)},
jelly(c,r,col){c.strokeStyle=sh(col,-.1);c.lineCap='round';c.lineWidth=3;c.globalAlpha=.7;
 for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(i*r*.35,0);c.bezierCurveTo(i*r*.35+r*.3,r*.4,i*r*.35-r*.3,r*.8,i*r*.35,r*1.4);c.stroke()}
 c.globalAlpha=.9;const g=c.createRadialGradient(0,-r*.4,r*.1,0,0,r);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.5,col);g.addColorStop(1,sh(col,-.2));
 c.fillStyle=g;c.beginPath();c.arc(0,0,r,Math.PI,0);for(let i=0;i<4;i++)c.quadraticCurveTo(r-i*r*.5-r*.25,r*.3,r-(i+1)*r*.5,0);c.fill();
 c.globalAlpha=1;c.fillStyle='#2b2d42';for(const x of[-.3,.3]){c.beginPath();c.arc(r*x,-r*.2,r*.07,0,7);c.fill()}
 c.fillStyle='rgba(255,120,150,.45)';for(const x of[-.5,.5]){c.beginPath();c.arc(r*x,-r*.05,r*.1,0,7);c.fill()}},
shrimp(c,r,col){const L=sh(col,.35),D=sh(col,-.25);
 c.fillStyle=D;c.beginPath();c.moveTo(-r*1.35,r*.05);c.lineTo(-r*1.9,-r*.4);c.lineTo(-r*1.75,r*.15);c.lineTo(-r*1.9,r*.6);c.closePath();c.fill();
 for(let i=3;i>=0;i--){const x=r*.6-i*r*.45,y=Math.sin(i*.9)*r*.12;c.fillStyle=lg(c,y-r*.5,y+r*.5,[L,col,D]);c.beginPath();c.ellipse(x,y,r*.5,r*.42,0,0,7);c.fill()}
 c.strokeStyle=D;c.lineWidth=2;c.lineCap='round';c.beginPath();c.moveTo(r*.8,-r*.25);c.quadraticCurveTo(r*1.4,-r*.9,r*1.9,-r*.5);c.moveTo(r*.85,-r*.1);c.quadraticCurveTo(r*1.5,-r*.5,r*2,-r*.1);c.stroke();
 for(let i=0;i<3;i++){c.beginPath();c.moveTo(r*.3-i*r*.4,r*.35);c.lineTo(r*.15-i*r*.4,r*.7);c.stroke()}
 eye(c,r*.85,-r*.1,r*.16)},
crab(c,r,col){const L=sh(col,.35),D=sh(col,-.3);c.lineCap='round';c.lineJoin='round';
 c.strokeStyle=D;c.lineWidth=r*.14;
 for(const s of[-1,1])for(let i=0;i<3;i++){const y=r*(.05+i*.22);c.beginPath();c.moveTo(s*r*.75,y);c.quadraticCurveTo(s*r*1.35,y-r*.2,s*r*1.5,y+r*.45);c.stroke()}
 for(const s of[-1,1]){c.strokeStyle=D;c.lineWidth=r*.2;c.beginPath();c.moveTo(s*r*.8,-r*.1);c.quadraticCurveTo(s*r*1.25,-r*.25,s*r*1.2,-r*.7);c.stroke();
  const a=s>0?[-1.36,3.92]:[-.78,4.5];c.fillStyle=lg(c,-r*1.3,-r*.4,[L,col]);c.beginPath();c.moveTo(s*r*1.15,-r*.85);c.arc(s*r*1.15,-r*.85,r*.45,a[0],a[1]);c.closePath();c.fill()}
 for(const s of[-1,1]){c.strokeStyle=D;c.lineWidth=r*.09;c.beginPath();c.moveTo(s*r*.3,-r*.4);c.lineTo(s*r*.35,-r*.8);c.stroke()}
 c.fillStyle=lg(c,-r*.55,r*.75,[L,col,D]);c.beginPath();c.ellipse(0,r*.1,r*1.0,r*.65,0,0,7);c.fill();
 c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.ellipse(-r*.15,-r*.12,r*.55,r*.18,-.1,0,7);c.fill();
 c.fillStyle='rgba(0,0,0,.12)';for(const[x,y]of[[-.5,.25],[.45,.2],[0,.4],[.1,.0]]){c.beginPath();c.arc(r*x,r*y,r*.07,0,7);c.fill()}

 if(Math.abs(e.vx)>.2)e.face=e.vx<0?-1:1;const f=e.face||1,t=frame*.12+(e.seed||0),k=e.radius*1.05/(e.species.startsWith('boss')?70:40),s=sp.width*k;
 ctx.save();ctx.translate(e.x,e.y);ctx.globalAlpha=alpha;
 if(e.species==='jelly'||e.species==='octopus')ctx.scale(f*(1-Math.sin(t)*.05),1+Math.sin(t)*.08);
 else if(e.species==='starfish')ctx.rotate(e.seed+frame*.006);
 else if(e.species==='crab'){ctx.translate(0,Math.sin(t*2)*1.5);ctx.scale(f,1+Math.sin(t*2)*.02)}
 else{ctx.rotate(f*Math.atan2(e.vy||0,Math.abs(e.vx)||1)*.5+Math.sin(t)*.02);ctx.scale(f*(1+Math.sin(t*1.3)*.015),1-Math.sin(t*1.3)*.015)}
 ctx.drawImage(sp,-s/2,-s/2,s,s);ctx.restore()}
function label(e,alpha){
 ctx.font='700 17px Quicksand,sans-serif';const w=ctx.measureText(e.word).width+20,h=26,b=box(e),lx=Math.max(w/2+4,Math.min(W-w/2-4,b.cx)),x=lx-w/2,y=Math.max(TOP+4,b.cy-b.hh-h-4);
 ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='rgba(255,255,255,.93)';ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,h,13);ctx.fill();
 ctx.fillStyle='#2b6cb0';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(e.word,lx,y+h/2+1);ctx.restore()}
function drawPlayer(alpha){
 const g=ctx.createRadialGradient(P.x,P.y,0,P.x,P.y,P.radius*2.6);g.addColorStop(0,'rgba(255,235,130,.3)');g.addColorStop(1,'rgba(255,235,130,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(P.x,P.y,P.radius*2.6,0,7);ctx.fill();
 if(P.buffs.magnet>0){ // magnet aura: rings contracting toward the player
  ctx.save();ctx.lineWidth=3;ctx.strokeStyle='rgba(170,90,230,.55)';ctx.setLineDash([10,8]);ctx.lineDashOffset=frame*1.5;
  ctx.beginPath();ctx.arc(P.x,P.y,MAGNET_RANGE,0,7);ctx.stroke();ctx.setLineDash([]);
  for(let i=0;i<2;i++){const ph=((frame*.02+i*.5)%1),rr=MAGNET_RANGE*(1-ph);ctx.strokeStyle=`rgba(170,90,230,${.35*ph})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(P.x,P.y,rr,0,7);ctx.stroke()}
  ctx.restore()}
 drawE(P,alpha);ctx.save();ctx.translate(P.x,P.y);
 if(P.buffs.shield>0){ctx.strokeStyle='#fb8500';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.lineDashOffset=-frame;ctx.fillStyle='rgba(251,133,0,.12)';ctx.beginPath();ctx.arc(0,0,P.radius*1.6,0,7);ctx.fill();ctx.stroke()}
 ctx.restore()}
function spawn(forceTarget){
 const left=Math.random()>.5,r=Math.random();
 let species=r<.28?'fish':r<.36?'squid':r<.46?'jelly':r<.54?'shrimp':r<.66?'crab':r<.72?'turtle':r<.80?'seahorse':r<.88?'puffer':r<.94?'octopus':'starfish';
 if(GROUND[species]&&enemies.filter(e=>e.ground).length>=2)species='fish';
 const isT=forceTarget||Math.random()<lv.tp,w=isT?target:WORDS[Math.random()*WORDS.length|0];
 const small=isT&&w===target||Math.random()>lv.big;
 let radius=P.radius*(small?(isT?.5+Math.random()*.3:.4+Math.random()*.4):1.4+Math.random()*1.0);if(!small)radius=Math.min(radius,Math.max(65,P.radius*1.15));
 const g=!!GROUND[species],e={x:0,y:0,sy:0,radius,species,ground:g,word:w.en,seed:Math.random()*6,vx:(Math.random()*lv.spd[1]+lv.spd[0])*(SPEED[species]||1)*(left?1:-1)*(1+difficulty*.4),color:PAL[Math.random()*PAL.length|0]};
 if(BOB[species])e.bob=BOB[species];
 const b0=box(e);e.x=left?-10-b0.hw-b0.cx:W+10+b0.hw-b0.cx;
 let best=-1e9,by=0;
 for(let k=0;k<12;k++){
  e.y=e.sy=g?H-Hs*(.14+Math.random()*.28):TOP+45+Math.random()*(H-Hs*.5-TOP-65);
  const a=box(e);let m=1e4;
  for(const o of enemies){if(!!o.ground!==g)continue;const b=box(o);if(Math.abs(b.cx-a.cx)<a.hw+b.hw+250)m=Math.min(m,Math.abs(b.cy-a.cy)-a.hh-b.hh)}
  if(m>best){best=m;by=e.y}}
 e.y=e.sy=by;enemies.push(e)}
function pickTarget(){const pool=WORDS.filter(w=>w!==target&&(vocab[w.en]||0)<2),all=WORDS.filter(w=>w!==target),src=pool.length&&Math.random()<.75?pool:all;target=src[Math.random()*src.length|0];$('t-e').textContent=target.e;$('t-vi').textContent=target.vi;noTarget=100}
function toast(h,cls){const t=$('toast');t.innerHTML=h;t.className='show '+cls;clearTimeout(tt);tt=setTimeout(()=>t.className='',1900)}
function burst(x,y,col,n){for(let i=0;i<n;i++)parts.push({x,y,col,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,a:1,s:Math.random()*4+2})}
function eat(e){
 const w=WORDS.find(x=>x.en===e.word);
 if(e.word===target.en){
  combo++;lastEat=Date.now();const pts=Math.floor(e.radius*(1+combo*.2))+30;score+=pts;P.radius=Math.min(70,P.radius+e.radius*.03);
  vocab[w.en]=(vocab[w.en]||0)+1;run.learned.add(w);try{localStorage.setItem('fish_vocab',JSON.stringify(vocab))}catch(_){}
  burst(e.x,e.y,'#ffd60a',8);texts.push({x:P.x,y:P.y-30,t:combo>1?`+${pts} x${combo}`:`+${pts}`,a:1,c:'#f08a24'});
  SFX.ok();say(w.en);pickTarget()
 }else{
  // Wrong-word fish: no penalty, still gives (smaller) points. Combo resets (no points lost).
  combo=0;const pts=Math.floor(e.radius*.8)+5;score+=pts;P.radius=Math.min(70,P.radius+e.radius*.02);
  burst(e.x,e.y,e.color,5);SFX.eat();
  texts.push({x:P.x,y:P.y-30,t:'+'+pts,a:1,c:'#3b7bb8'});
  toast(`${w.e} <b>${w.en}</b> = ${w.vi}`,'meh');say(w.en)}
 updateHUD()}
function hurt(inv){
 P.lives--;P.invincible=inv;shake=6;SFX.hit();
 score=Math.max(0,score-lv.pen);combo=0;
 texts.push({x:P.x,y:P.y-30,t:'-'+lv.pen,a:1,c:'#d64d7b'});
 updateHUD();if(P.lives<=0)endGame()}

// ---------- Game step ----------
function step(){
 difficulty=Math.min(5,frame/2000);
 const sm=P.buffs.speed>0?2:P.debuffs.slow>0?.4:1;
 P.vx=(P.tx-P.x)*.3;P.vy=(P.ty-P.y)*.3;{const q=Math.hypot(P.vx,P.vy);if(q>30){P.vx*=30/q;P.vy*=30/q}}P.x+=P.vx*sm;P.y+=P.vy*sm;if(P.y<TOP+12)P.y=TOP+12;
 if(P.invincible>0)P.invincible--;for(const k in P.buffs)if(P.buffs[k]>0)P.buffs[k]--;if(P.debuffs.slow>0)P.debuffs.slow--;
 if(P.buffs.speed>0&&frame%6===0)burst(P.x,P.y,'#7fe0e8',1);
 if(frame%10===0)updateHUD();
 if(Date.now()-lastEat>3000&&combo){combo=0;updateHUD()}
 // Items: magnet ~8%, shield ~11%, speed ~11%, trash/net share the rest
 if(Math.random()<lv.item*.5){const r=Math.random(),type=r<.15?'MAGNET':r<.37?'SHIELD':r<.59?'SPEED':r<.795?'TRASH':null;if(type)items.push({x:Math.random()*W,y:-50,type,icon:{SHIELD:'🛡️',SPEED:'⚡',TRASH:'🥫',MAGNET:'🧲'}[type],vy:1.5,ph:Math.random()*6})}
 for(let i=items.length-1;i>=0;i--){const it=items[i];it.y+=it.vy;
  if(Math.hypot(P.x-it.x,P.y-it.y)<P.radius+20){
   if(it.type==='SHIELD')P.buffs.shield=400;else if(it.type==='SPEED')P.buffs.speed=300;else if(it.type==='MAGNET'){P.buffs.magnet=420;SFX.magnet();toast('🧲 <b>Nam châm!</b> Hút hết cá bé xung quanh','ok')}else{P.radius=Math.max(16,P.radius-6);score=Math.max(0,score-50)}
   burst(it.x,it.y,'#fff',3);items.splice(i,1);updateHUD()}else if(it.y>H+50)items.splice(i,1)}
 if(enemies.reduce((n,e)=>n+!e.ground,0)<lv.cap[W<600?0:1]&&Math.random()<lv.sp[mode==='timed'?1:0]+difficulty*lv.gr)spawn(false);
 if(enemies.some(e=>e.word===target.en&&e.radius<P.radius*.95))noTarget=0;else if(++noTarget>lv.nt){spawn(true);noTarget=0}
 // Separation: use the real sprite boxes (tentacles, claws, antennae) and gently push overlapping creatures apart vertically
 {const pulled=e=>P.buffs.magnet>0&&e.radius<P.radius*.95&&Math.hypot(P.x-e.x,P.y-e.y)<MAGNET_RANGE,
  lim=e=>e.ground?[H-Hs*.46,H-Hs*.1]:[TOP+45,H-Hs*.5-20],
  mv=(e,dv)=>{const[lo,hi]=lim(e),n=e.sy+dv;if(dv<0&&n<lo||dv>0&&n>hi)return;e.sy=n;e.y+=dv};
  for(let i=0;i<enemies.length;i++){const a=enemies[i];for(let j=i+1;j<enemies.length;j++){const b=enemies[j];
   if(!!a.ground!==!!b.ground||pulled(a)||pulled(b))continue;
   const A=box(a),B=box(b),ox=A.hw+B.hw-Math.abs(B.cx-A.cx),oy=A.hh+B.hh-Math.abs(B.cy-A.cy);
   if(ox>0&&oy>0){const dir=B.cy===A.cy?(a.seed>b.seed?1:-1):Math.sign(B.cy-A.cy),push=Math.min(4,oy*.15+.3);mv(a,-dir*push);mv(b,dir*push)}}}}
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.x+=e.vx;if(e.bob)e.y=e.sy+Math.sin(frame*.02+e.seed)*e.bob;
  // Magnet: pull every smaller fish within range toward the player (stronger when closer)
  if(P.buffs.magnet>0&&e.radius<P.radius*.95){const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy);
   if(d<MAGNET_RANGE&&d>1){const pull=.05+.1*(1-d/MAGNET_RANGE);e.x+=dx*pull;e.y+=dy*pull;e.sy+=dy*pull;if(frame%8===0)burst(e.x,e.y,'#c58bf2',1)}}
  if(e.x<-300||e.x>W+300){enemies.splice(i,1);continue}
  if(Math.hypot(P.x-e.x,P.y-e.y)<P.radius+e.radius*.7){
   if(P.radius>e.radius){eat(e);enemies.splice(i,1)}else if(P.invincible<=0&&P.buffs.shield<=0)hurt(100)}}
 if(frame>=nextBoss&&!boss&&!warn){warn=1;warnT=Date.now()+3000;nextBoss=frame+lv.be;SFX.boss()}
 if(warn&&Date.now()>=warnT){warn=0;boss={x:-210,y:H/2,radius:120,vx:7.5,vy:0,color:BOSS,species:'boss',seed:0};SFX.growl()}
 if(boss){boss.x+=boss.vx;boss.y=H/2+Math.sin(frame*.035)*150;if(boss.x>0&&boss.x<W)shake=Math.max(shake,3);
  const bs=boss.radius*1.05;
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],dx=(e.x-(boss.x+.35*bs))/(1.45*bs+e.radius*.5),dy=(e.y-boss.y)/(.75*bs+e.radius*.5);
   if(dx*dx+dy*dy<1){burst(e.x,e.y,e.color,7);burst(e.x,e.y,'#ffffff',4);SFX.crunch();enemies.splice(i,1)}}
  {const dx=(P.x-(boss.x+.3*bs))/(1.3*bs+P.radius*.6),dy=(P.y-boss.y)/(.62*bs+P.radius*.6);
   if(dx*dx+dy*dy<1&&P.invincible<=0&&P.buffs.shield<=0)hurt(120)}
  if(boss.x>W+300)boss=null}}

function loop(){
 frame++;ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake--}
 drawBG();drawBubbles();if(playing)step();
 const dim=playing?1:.45;
 if(boss){ctx.fillStyle='rgba(50,0,25,.14)';ctx.fillRect(0,0,W,H)}
 for(const it of items){ctx.font='26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(it.x,it.y,20,0,7);ctx.fill();ctx.fillText(it.icon,it.x,it.y+Math.sin(frame*.08+it.ph)*4)}
 for(const e of enemies){drawE(e,dim);label(e,dim)}
 if(boss){const g=ctx.createRadialGradient(boss.x,boss.y,boss.radius*.4,boss.x,boss.y,boss.radius*2.8);g.addColorStop(0,'rgba(230,20,50,.18)');g.addColorStop(1,'rgba(230,20,50,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(boss.x,boss.y,boss.radius*2.8,0,7);ctx.fill();
  boss.species=['boss','boss1','boss2','boss1'][((frame/7)|0)%4];drawE(boss)}
 if(playing||enemies.length||P.lives>0&&score>0)drawPlayer(playing?(P.invincible>0&&frame%10<5?.35:1):.6);
 parts=parts.filter(p=>p.a>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.a-=.03;ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()}ctx.globalAlpha=1;
 texts=texts.filter(t=>t.a>0);for(const t of texts){t.y-=1;t.a-=.02;ctx.globalAlpha=Math.max(0,t.a);ctx.fillStyle=t.c;ctx.font='700 18px Quicksand,sans-serif';ctx.textAlign='center';ctx.fillText(t.t,t.x,t.y)}ctx.globalAlpha=1;
 if(warn>0){const a=Math.abs(Math.sin(frame*.1));ctx.fillStyle=`rgba(183,28,28,${a*.3})`;ctx.fillRect(0,H/2-80,W,160);ctx.font='700 '+Math.min(34,W/14)+'px Quicksand,sans-serif';ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.textAlign='center';ctx.fillText('⚠️ CÁ MẬP ĐẠI DƯƠNG ĐANG ĐẾN! ⚠️',W/2,H/2+10)}
 ctx.restore();
 ctx.drawImage(vig,0,0,W,H);
 ctx.fillStyle=lg(ctx,0,TOP,['#eaf7ff','#cdeafc']);ctx.fillRect(0,0,W,TOP);ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(0,TOP,W,2);
 raf=requestAnimationFrame(loop)}

// ---------- UI ----------
function updateHUD(){
 $('score').textContent=Math.floor(score);$('combo').classList.toggle('hidden',combo<2);$('combo-b').textContent='x'+combo;
 $('lives').innerHTML=mode==='timed'?'':Array.from({length:lv.lives},(_,i)=>i<P.lives?'❤️':'🖤').join(' ');
 let s='';if(P.buffs.shield>0)s+=`<div class="badge" style="color:#f08a24">🛡️ ${Math.ceil(P.buffs.shield/60)}s</div>`;if(P.buffs.speed>0)s+=`<div class="badge" style="color:#219ebc">⚡ ${Math.ceil(P.buffs.speed/60)}s</div>`;if(P.buffs.magnet>0)s+=`<div class="badge" style="color:#9b4fd6">🧲 ${Math.ceil(P.buffs.magnet/60)}s</div>`;
 $('fx').innerHTML=s}
function startGame(m,sec=30){
 if(A&&A.state==='suspended')A.resume();clearInterval(timerId);
 mode=m;playing=true;score=0;frame=0;difficulty=0;combo=0;boss=null;warn=0;nextBoss=lv.bf;shake=0;
 P.radius=24;P.lives=m==='timed'?99:lv.lives;P.x=P.tx=W/2;P.y=P.ty=H/2;P.vx=P.vy=0;P.invincible=0;P.buffs={shield:0,speed:0,magnet:0};P.debuffs={slow:0};
 enemies=[];parts=[];texts=[];items=[];run={learned:new Set(),missed:new Set()};
 ['start','over','lb'].forEach(i=>$(i).classList.add('hidden'));['hud','target'].forEach(i=>$(i).classList.remove('hidden'));
 pickTarget();
 if(m==='timed'){timeLeft=sec;$('tsec').textContent=sec;$('timer').classList.remove('hidden');timerId=setInterval(()=>{$('tsec').textContent=--timeLeft;if(timeLeft<=0)endGame()},1000)}else $('timer').classList.add('hidden');
 updateHUD()}
function endGame(){
 if(!playing)return;playing=false;clearInterval(timerId);
 ['hud','target','timer'].forEach(i=>$(i).classList.add('hidden'));$('fx').innerHTML='';
 $('over').classList.remove('hidden');$('final').textContent=Math.floor(score);
 const L=[...run.learned];
 $('recap').innerHTML=L.length?`<div class="sub" style="margin:0">Đã học được ${L.length} từ</div><div class="chips">${L.map(w=>`<span class="chip">${w.e} ${w.en} = ${w.vi}</span>`).join('')}</div>`:'';
 const b=$('save');b.disabled=false;b.textContent='LƯU';
 b.onclick=()=>{lbSave($('name').value.trim(),Math.floor(score));b.disabled=true;b.textContent='ĐÃ LƯU';lbRender('end-list','all')};
 lbRender('end-list','all')}
function toMenu(){$('over').classList.add('hidden');$('start').classList.remove('hidden');enemies=[];items=[];boss=null;progress()}

addEventListener('load',()=>{cv=$('c');ctx=cv.getContext('2d',{alpha:false});resize();preRender();progress();P.x=W/2;P.y=H/2;P.lives=0;loop()});
addEventListener('resize',()=>{if(cv)resize()});
function aim(e){if(playing){P.tx=e.clientX;P.ty=Math.max(e.clientY,TOP+20)}}
addEventListener('pointermove',aim);addEventListener('pointerdown',aim);
</script>
